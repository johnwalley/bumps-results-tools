name: Node CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ci-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm test
        env:
          CI: true
      - name: Check AD format files match the TG sources
        run: |
          pnpm run generate:ad
          git add --intent-to-add results/ad_format
          git diff --exit-code --stat results/ad_format
